[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  functions = "../netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# React SPA fallback. This keeps direct visits and refreshes working for
# /menu-builder, /menu-studio/*, /my-menus/* and /menu/*.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
