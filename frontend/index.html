<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="/beyond-logo.png?v=2"
    />

    <link
      id="beyond-apple-touch-icon"
      rel="apple-touch-icon"
      sizes="180x180"
      href="/beyond-apple-light.png?v=6"
    />

    <script>
      (() => {
        const media = window.matchMedia("(prefers-color-scheme: dark)");
        const updateAppleIcon = () => {
          const icon = document.getElementById("beyond-apple-touch-icon");
          if (!icon) return;
          icon.href = media.matches
            ? "/beyond-apple-dark.png?v=6"
            : "/beyond-apple-light.png?v=6";
        };
        updateAppleIcon();
        if (typeof media.addEventListener === "function") {
          media.addEventListener("change", updateAppleIcon);
        }
      })();
    </script>

    <meta
      name="apple-mobile-web-app-title"
      content="BEYOND"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#02050a"
    />

    <meta
      name="description"
      content="BEYOND — From digital ideas to physical objects."
    />

    <title>BEYOND</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
