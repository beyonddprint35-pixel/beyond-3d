<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="/beyond-logo.png?v=2"
    />

    <script>
      (() => {
        const media = window.matchMedia("(prefers-color-scheme: dark)");
        const icon = document.createElement("link");
        icon.id = "beyond-apple-touch-icon";
        icon.rel = "apple-touch-icon";
        icon.sizes = "180x180";

        const updateAppleIconForInstall = () => {
          icon.href = media.matches
            ? "/beyond-apple-dark-v2.png"
            : "/beyond-apple-light-v2.png";
          icon.dataset.appearance = media.matches ? "dark" : "light";
        };

        updateAppleIconForInstall();
        document.head.appendChild(icon);

        // This updates the icon Safari will use for a FUTURE Add to Home Screen.
        // iOS caches an already-installed Web Clip icon and does not live-swap it.
        if (typeof media.addEventListener === "function") {
          media.addEventListener("change", updateAppleIconForInstall);
        }
      })();
    </script>

    <meta
      name="apple-mobile-web-app-title"
      content="BEYOND"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#02050a"
    />

    <meta
      name="description"
      content="BEYOND — From digital ideas to physical objects."
    />

    <title>BEYOND</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
