<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Beyond Admin</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="assets/css/admin.css"
  />

  <script
    src="assets/js/admin.js"
    defer
  ></script>
</head>

<body>
  <main class="container">

    <header class="topbar">
      <div class="brand">
        BEYOND
      </div>

      <div class="admin-label">
        Admin Dashboard
      </div>
    </header>

    <section class="hero">
      <h1>Orders</h1>

      <p>
        Manage incoming 3D printing requests.
      </p>
    </section>

    <section class="stats">

      <div class="stat-card">
        <div class="stat-label">
          Total Orders
        </div>

        <div
          class="stat-value"
          id="total-orders"
        >
          0
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-label">
          Submitted
        </div>

        <div
          class="stat-value"
          id="submitted-orders"
        >
          0
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-label">
          Printing
        </div>

        <div
          class="stat-value"
          id="printing-orders"
        >
          0
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-label">
          Completed
        </div>

        <div
          class="stat-value"
          id="completed-orders"
        >
          0
        </div>
      </div>

    </section>

    <section>

      <div class="orders-header">

        <h2>
          Latest Orders
        </h2>

        <div class="header-actions">

          <button
            class="refresh-button"
            id="refresh-button"
            type="button"
          >
            Refresh
          </button>

          <button
            class="logout-button"
            id="logout-button"
            type="button"
          >
            Logout
          </button>

        </div>

      </div>

      <div
        id="orders-list"
        class="orders-list"
      >
        <div class="loading">
          Loading orders...
        </div>
      </div>

    </section>

  </main>
</body>
</html>
