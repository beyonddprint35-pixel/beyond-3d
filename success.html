<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Request received | Beyond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0b315f;--soft:#f3f4f6;--muted:#667489;--line:#dfe4e9}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--soft);color:var(--navy);font-family:Inter,Arial,sans-serif;padding:24px}
    .card{max-width:590px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:26px;padding:55px 35px;box-shadow:0 22px 60px rgba(11,49,95,.10)}
    .logo{width:180px;max-width:70%;height:auto;margin-bottom:28px}.check{width:72px;height:72px;margin:auto;display:grid;place-items:center;border-radius:50%;background:var(--navy);color:#fff;font-size:35px;font-weight:800}
    h1{font-size:42px;letter-spacing:-.04em;margin:24px 0 12px}p{color:var(--muted);line-height:1.65}a{display:inline-block;margin-top:18px;padding:13px 20px;border-radius:11px;background:var(--navy);color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/beyond-logo.png" alt="Beyond">
    <div class="check">✓</div>
    <h1>Request received</h1>
    <p>Thank you. Your project details and uploaded file were submitted successfully. We’ll review everything and contact you with questions or a quotation.</p>
    <a href="./index.html">Back to Beyond</a>
  </main>
</body>
</html>
