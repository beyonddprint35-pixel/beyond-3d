name: One-time fix design card labels

on:
  push:
    branches:
      - studio-mobile-remodel-development
    paths:
      - .github/workflows/one-time-fix-design-card-labels.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio-mobile-remodel-development
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch visible design cards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/features/menu-engine/studio/MenuDesignControls.jsx')
          text = path.read_text()

          replacements = {
              '<strong>{t.colors}</strong>': '<strong>{language==="he"?"ערכות נושא":language==="ar"?"السمات":"Themes"}</strong>',
              '<strong>{t.typography}</strong>': '<strong>{language==="he"?"סגנון וצבע טקסט":language==="ar"?"نمط ولون النص":"Text style & color"}</strong>',
              '<strong>{t.hero}</strong><small>{t.heroHint}</small></div><button type="button" onClick={()=>openFocus("hero")}>•••</button></div>\n          <div className="studio-v3-quick-hero-grid">': '<strong>{language==="he"?"תמונה עליונה וכותרת":language==="ar"?"الصورة العلوية والعنوان":"Top photo & header"}</strong><small>{t.heroHint}</small></div><button type="button" onClick={()=>openFocus("hero")}>•••</button></div>\n          {heroHeadlineControl}\n          <div className="studio-v3-quick-hero-grid">',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source not found: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "beyonddprint35-pixel"
          git config user.email "beyonddprint35@gmail.com"
          git add frontend/src/features/menu-engine/studio/MenuDesignControls.jsx
          git commit -m "Fix visible design card labels and group hero headline"
          git push origin studio-mobile-remodel-development
