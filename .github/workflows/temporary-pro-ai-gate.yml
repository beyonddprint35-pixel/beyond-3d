name: Apply Beyond Pro AI gate

on:
  push:
    branches:
      - studio-mobile-remodel-development
    paths:
      - .github/workflows/temporary-pro-ai-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio-mobile-remodel-development
          fetch-depth: 0
      - name: Gate photo AI behind Premium subscription
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing patch anchor: {label}")
              return text.replace(old, new, 1)

          editor_path = Path("frontend/src/components/MenuContentImageEditor.jsx")
          editor = editor_path.read_text()

          editor = replace_once(
              editor,
              'import { enhanceMenuPhotoWithAi, getRestaurantScenePresets } from "../features/menu-engine/data/menuPhotoAiService";\n',
              'import { enhanceMenuPhotoWithAi, getRestaurantScenePresets } from "../features/menu-engine/data/menuPhotoAiService";\nimport useMenuProEntitlement from "../features/menu-engine/studio/useMenuProEntitlement";\n',
              "editor entitlement import",
          )
          editor = replace_once(
              editor,
              'import "./MenuContentImageEditor.css";\n',
              'import MenuProBadge from "./MenuProBadge";\nimport "./MenuContentImageEditor.css";\n',
              "editor pro badge import",
          )
          editor = replace_once(
              editor,
              '};\n\nconst PHOTO_STYLE_DEFAULT =',
              '''};

const PRO_LOCK_COPY = {
  en: { locked: "This AI feature is available with a Beyond Pro plan subscription.", checking: "Checking your subscription…" },
  he: { locked: "תכונת ה-AI הזו זמינה במסגרת מנוי Beyond Pro.", checking: "בודק את המנוי…" },
  ar: { locked: "ميزة الذكاء الاصطناعي هذه متاحة ضمن اشتراك Beyond Pro.", checking: "جارٍ التحقق من الاشتراك…" },
};

const PHOTO_STYLE_DEFAULT =''',
              "editor pro copy",
          )
          editor = replace_once(
              editor,
              '  const styleCopy = PHOTO_STYLE_COPY[language] || PHOTO_STYLE_COPY.en;\n',
              '''  const styleCopy = PHOTO_STYLE_COPY[language] || PHOTO_STYLE_COPY.en;
  const proCopy = PRO_LOCK_COPY[language] || PRO_LOCK_COPY.en;
  const { canUseAi, loading: subscriptionLoading } = useMenuProEntitlement(projectId);
''',
              "editor entitlement state",
          )
          editor = replace_once(
              editor,
              '''  async function generatePreview() {
    if (!sourceUrl || processing) return;
''',
              '''  async function generatePreview() {
    if (!sourceUrl || processing) return;
    if (subscriptionLoading) return setError(proCopy.checking);
    if (!canUseAi) return setError(proCopy.locked);
''',
              "editor generate hard guard",
          )
          editor = replace_once(
              editor,
              '''  function openAiPhotos() {
    const params = new URLSearchParams(window.location.search || "");
''',
              '''  function openAiPhotos() {
    if (subscriptionLoading) return setError(proCopy.checking);
    if (!canUseAi) return setError(proCopy.locked);
    const params = new URLSearchParams(window.location.search || "");
''',
              "editor advanced AI guard",
          )
          editor = replace_once(
              editor,
              '''  function openStudio() {
    const options = optionsFromItem(item);
''',
              '''  function openStudio() {
    if (subscriptionLoading) return setError(proCopy.checking);
    if (!canUseAi) return setError(proCopy.locked);
    const options = optionsFromItem(item);
''',
              "editor enhance gate",
          )
          editor = replace_once(
              editor,
              '<span><strong>{copy.prepare}</strong><small>{copy.prepareHint}</small></span>',
              '<span><strong>{copy.prepare}<MenuProBadge language={language} /></strong><small>{copy.prepareHint}</small></span>',
              "enhance PRO badge",
          )
          editor = replace_once(
              editor,
              '<span><strong>{copy.advancedAi}</strong><small>{copy.advancedAiHint}</small></span>',
              '<span><strong>{copy.advancedAi}<MenuProBadge language={language} /></strong><small>{copy.advancedAiHint}</small></span>',
              "advanced AI PRO badge",
          )
          editor_path.write_text(editor)

          ai_path = Path("frontend/src/pages/MenuAiDishImagesV1.jsx")
          ai = ai_path.read_text()
          ai = replace_once(
              ai,
              'import StudioLanguageMenu from "../components/StudioLanguageMenu";\n',
              'import StudioLanguageMenu from "../components/StudioLanguageMenu";\nimport MenuProBadge from "../components/MenuProBadge";\n',
              "AI page badge import",
          )
          ai = replace_once(
              ai,
              'import { readStudioLanguage, studioLanguageDirection, writeStudioLanguage } from "../features/menu-engine/studio/studioLanguage";\n',
              'import { readStudioLanguage, studioLanguageDirection, writeStudioLanguage } from "../features/menu-engine/studio/studioLanguage";\nimport useMenuProEntitlement from "../features/menu-engine/studio/useMenuProEntitlement";\n',
              "AI page entitlement import",
          )
          ai = replace_once(
              ai,
              '};\n\nfunction projectIdFor(draft)',
              '''};

const PRO_GATE_COPY = {
 en:{locked:"AI Photo Studio is available with a Beyond Pro plan subscription.",checking:"Checking your subscription…"},
 he:{locked:"סטודיו התמונות AI זמין במסגרת מנוי Beyond Pro.",checking:"בודק את המנוי…"},
 ar:{locked:"استوديو صور AI متاح ضمن اشتراك Beyond Pro.",checking:"جارٍ التحقق من الاشتراك…"}
};

function projectIdFor(draft)''',
              "AI page pro copy",
          )
          ai = replace_once(
              ai,
              ' const menu=draft?.menu;const projectId=projectIdFor(draft);const placeStyle=draft?.profile?.aiPlaceStyle||null;\n',
              ''' const menu=draft?.menu;const projectId=projectIdFor(draft);const placeStyle=draft?.profile?.aiPlaceStyle||null;
 const {canUseAi,loading:subscriptionLoading}=useMenuProEntitlement(projectId);const proGate=PRO_GATE_COPY[uiLanguage]||PRO_GATE_COPY.en;
''',
              "AI page entitlement state",
          )
          ai = replace_once(
              ai,
              ' async function generate(){if(!currentItem||running)return;if(!placeStyle?.photos?.length)',
              ' async function generate(){if(!currentItem||running)return;if(subscriptionLoading)return setError(proGate.checking);if(!canUseAi)return setError(proGate.locked);if(!placeStyle?.photos?.length)',
              "AI page generate hard guard",
          )
          marker = ' return <main className="ai-dish-v1 ai-photo-v2" dir={rtl?"rtl":"ltr"} lang={uiLanguage}>'
          if marker not in ai:
              raise SystemExit("Missing patch anchor: AI page main render")
          gate = ''' if(subscriptionLoading)return <main className="ai-dish-v1 ai-dish-v1-empty"><div><LoaderCircle className="spin" size={24}/><h1>{proGate.checking}</h1><button onClick={goBack}>{t.back}</button></div></main>;
 if(!canUseAi)return <main className="ai-dish-v1 ai-dish-v1-empty"><div className="ai-pro-gate"><MenuProBadge language={uiLanguage}/><h1>{t.title}</h1><p>{proGate.locked}</p><button onClick={goBack}>{t.back}</button></div></main>;
'''
          ai = ai.replace(marker, gate + marker, 1)
          ai = replace_once(
              ai,
              '<span><Sparkles size={14}/> AI PHOTO STUDIO</span>',
              '<span><Sparkles size={14}/> AI PHOTO STUDIO <MenuProBadge language={uiLanguage}/></span>',
              "AI page hero PRO badge",
          )
          ai_path.write_text(ai)
          PY

          git config user.name "beyond-patch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/components/MenuContentImageEditor.jsx frontend/src/pages/MenuAiDishImagesV1.jsx
          git commit -m "Gate photo AI behind Beyond Pro"
          git push origin HEAD:studio-mobile-remodel-development
