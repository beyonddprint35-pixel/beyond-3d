name: One-time text controls grouping

on:
  push:
    branches:
      - studio-mobile-remodel-development
    paths:
      - .github/workflows/one-time-text-controls.yml

permissions:
  contents: write

jobs:
  patch-text-controls:
    if: github.event.head_commit.message == 'Run one-time text control grouping patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio-mobile-remodel-development
          fetch-depth: 0
      - name: Reorganize Colors and Text controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/features/menu-engine/studio/MenuDesignControls.jsx')
          source = path.read_text(encoding='utf-8')

          replacements = {
              'typePanel:"Type"': 'typePanel:"Text"',
              'typePanel:"טיפוגרפיה"': 'typePanel:"טקסט"',
              'typePanel:"الخطوط"': 'typePanel:"النص"',
              'palettePresets:"Palette presets",customColors:"Custom colors",fonts:': 'palettePresets:"Palette presets",customColors:"Custom colors",textColors:"Text colors",fonts:',
              'palettePresets:"פלטות צבעים",customColors:"צבעים מותאמים",fonts:': 'palettePresets:"פלטות צבעים",customColors:"צבעים מותאמים",textColors:"צבעי טקסט",fonts:',
              'palettePresets:"لوحات الألوان",customColors:"ألوان مخصصة",fonts:': 'palettePresets:"لوحات الألوان",customColors:"ألوان مخصصة",textColors:"ألوان النص",fonts:',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match for: {old}')
              source = source.replace(old, new, 1)

          colors_block = '''        {panel==="colors"?<div className="studio-v3-design-section studio-v3-inspector-panel"><section className="studio-v3-inspector-block"><div className="studio-v3-inspector-block-title"><span>{t.palettePresets}</span></div><div className="studio-v3-inspector-palette-grid">{Object.entries(MENU_COLOR_PRESETS).map(([key,preset])=><button type="button" key={key} className={`studio-v3-inspector-palette ${activePaletteKey===key?"active":""}`} onClick={()=>patchDesign(current=>applyMenuColorPreset(current,key))}><span className="studio-v3-inspector-palette-swatches">{[preset.theme.background,preset.theme.card,preset.theme.accent,preset.theme.text,preset.theme.categoryBackground].map((color,index)=><i key={`${color}-${index}`} style={{background:color}}/>)}</span><strong>{preset.label}</strong></button>)}</div></section><section className="studio-v3-inspector-block"><div className="studio-v3-inspector-block-title"><span>{t.customColors}</span></div><div className="studio-v3-inspector-color-grid"><ColorField label={t.background} value={design.theme.background} onChange={value=>patchTheme("background",value)}/><ColorField label={t.cards} value={design.theme.card} onChange={value=>patchTheme("card",value)}/><ColorField label={t.accent} value={design.theme.accent} onChange={value=>patchTheme("accent",value)}/><ColorField label={t.category} value={design.theme.categoryBackground} onChange={value=>patchTheme("categoryBackground",value)}/></div></section></div>:null}'''

          type_block = '''        {panel==="type"?<div className="studio-v3-design-section studio-v3-inspector-panel"><section className="studio-v3-inspector-block"><div className="studio-v3-inspector-block-title"><span>{t.fonts}</span></div><div className="studio-v3-font-grid"><FontField label={t.headingFont} value={design.typography.headingFont} onChange={value=>patchType("headingFont",value)}/><FontField label={t.bodyFont} value={design.typography.bodyFont} onChange={value=>patchType("bodyFont",value)}/></div></section><section className="studio-v3-inspector-block"><div className="studio-v3-inspector-block-title"><span>{t.textColors}</span></div><div className="studio-v3-inspector-color-grid"><ColorField label={t.text} value={design.theme.text} onChange={value=>patchTheme("text",value)}/><ColorField label={t.muted} value={design.theme.muted} onChange={value=>patchTheme("muted",value)}/></div></section><section className="studio-v3-inspector-block"><div className="studio-v3-inspector-block-title"><span>{t.hero}</span></div><div className="studio-v3-design-control-label">{t.headingWeight}</div><div className="studio-v3-weight-grid">{MENU_FONT_WEIGHTS.map(value=><button type="button" key={value} className={`studio-v3-weight-choice ${design.typography.headingWeight===value?"active":""}`} style={{fontWeight:value}} onClick={()=>patchType("headingWeight",value)}>{value}</button>)}</div><div className="studio-v3-type-scale"><RangeField label={t.heroSize} value={design.typography.heroSize} min={MENU_DESIGN_CONSTRAINTS.typography.heroSize.min} max={MENU_DESIGN_CONSTRAINTS.typography.heroSize.max} onChange={value=>patchType("heroSize",value)}/><RangeField label={t.sectionSize} value={design.typography.sectionSize} min={MENU_DESIGN_CONSTRAINTS.typography.sectionSize.min} max={MENU_DESIGN_CONSTRAINTS.typography.sectionSize.max} onChange={value=>patchType("sectionSize",value)}/></div></section><section className="studio-v3-inspector-block"><div className="studio-v3-inspector-block-title"><span>{t.items}</span></div><div className="studio-v3-design-control-label">{t.itemWeight}</div><div className="studio-v3-weight-grid">{MENU_FONT_WEIGHTS.map(value=><button type="button" key={value} className={`studio-v3-weight-choice ${design.typography.itemWeight===value?"active":""}`} style={{fontWeight:value}} onClick={()=>patchType("itemWeight",value)}>{value}</button>)}</div><div className="studio-v3-type-scale"><RangeField label={t.itemNameSize} value={design.typography.itemNameSize} min={MENU_DESIGN_CONSTRAINTS.typography.itemNameSize.min} max={MENU_DESIGN_CONSTRAINTS.typography.itemNameSize.max} onChange={value=>patchType("itemNameSize",value)}/><RangeField label={t.descriptionSize} value={design.typography.descriptionSize} min={MENU_DESIGN_CONSTRAINTS.typography.descriptionSize.min} max={MENU_DESIGN_CONSTRAINTS.typography.descriptionSize.max} onChange={value=>patchType("descriptionSize",value)}/><RangeField label={t.priceSize} value={design.typography.priceSize} min={MENU_DESIGN_CONSTRAINTS.typography.priceSize.min} max={MENU_DESIGN_CONSTRAINTS.typography.priceSize.max} onChange={value=>patchType("priceSize",value)}/></div></section><section className="studio-v3-inspector-block"><div className="studio-v3-inspector-block-title"><span>{t.categories}</span></div><div className="studio-v3-inspector-color-grid"><ColorField label={t.categoryText} value={design.theme.categoryText} onChange={value=>patchTheme("categoryText",value)}/></div></section></div>:null}'''

          colors_pattern = re.compile(r'        \{panel==="colors"\?<div className="studio-v3-design-section studio-v3-inspector-panel">.*?</div>:null\}\n\n(?=        \{panel==="type"\?)', re.S)
          source, color_count = colors_pattern.subn(colors_block + '\n\n', source, count=1)
          if color_count != 1:
              raise SystemExit(f'Expected one Colors panel, found {color_count}')

          type_pattern = re.compile(r'        \{panel==="type"\?<div className="studio-v3-design-section studio-v3-inspector-panel">.*?</div>:null\}\n\n(?=        \{panel==="layout"\?)', re.S)
          source, type_count = type_pattern.subn(type_block + '\n\n', source, count=1)
          if type_count != 1:
              raise SystemExit(f'Expected one Text panel, found {type_count}')

          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit UI reorganization
        shell: bash
        run: |
          git config user.name "Beyond UI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/features/menu-engine/studio/MenuDesignControls.jsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Group text controls and simplify color panel"
          git push origin HEAD:studio-mobile-remodel-development
