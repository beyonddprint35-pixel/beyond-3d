name: One-time text style toolbar

on:
  push:
    branches:
      - studio-mobile-remodel-development
    paths:
      - .github/workflows/one-time-text-style-toolbar.yml

permissions:
  contents: write

jobs:
  patch-text-style-toolbar:
    if: github.event.head_commit.message == 'Run one-time text style toolbar patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio-mobile-remodel-development
          fetch-depth: 0

      - name: Rebuild per-role text editor
        shell: bash
        run: |
          set -euo pipefail

          cat > frontend/src/features/menu-engine/studio/MenuItemNameColorControl.jsx <<'EOF'
          import { useEffect, useState } from "react";
          import "./MenuItemNameColorControl.css";

          const COPY = {
            en: {
              title: "Text styles",
              hint: "Set color, size and formatting for every text style.",
              reset: "Use theme color",
              styleReset: "Reset style",
              black: "Black",
              fontSize: "Font size",
              bold: "Bold",
              italic: "Italic",
              underline: "Underline",
              brandGroup: "Brand",
              heroGroup: "Hero & header",
              categoriesGroup: "Categories",
              itemsGroup: "Menu items",
              footerGroup: "Footer",
              brandTitle: "Restaurant name",
              brandSubtitle: "Restaurant subtitle",
              heroKicker: "Hero small label",
              heroTitle: "Hero title",
              categoryNav: "Category tabs",
              sectionTitle: "Category title",
              subcategoryTitle: "Subcategory title",
              itemName: "Item name",
              description: "Description",
              price: "Price",
              priceType: "Price type",
              note: "Category notes",
              footer: "Footer text",
            },
            he: {
              title: "סגנונות טקסט",
              hint: "בחרו צבע, גודל ועיצוב לכל סוג טקסט בנפרד.",
              reset: "השתמש בצבע העיצוב",
              styleReset: "איפוס סגנון",
              black: "שחור",
              fontSize: "גודל פונט",
              bold: "מודגש",
              italic: "נטוי",
              underline: "קו תחתון",
              brandGroup: "מותג",
              heroGroup: "Hero וכותרת",
              categoriesGroup: "קטגוריות",
              itemsGroup: "פריטי תפריט",
              footerGroup: "תחתית",
              brandTitle: "שם המסעדה",
              brandSubtitle: "כותרת משנה למסעדה",
              heroKicker: "תווית קטנה ב-Hero",
              heroTitle: "כותרת Hero",
              categoryNav: "לשוניות קטגוריה",
              sectionTitle: "כותרת קטגוריה",
              subcategoryTitle: "כותרת תת-קטגוריה",
              itemName: "שם הפריט",
              description: "תיאור",
              price: "מחיר",
              priceType: "סוג מחיר",
              note: "הערות קטגוריה",
              footer: "טקסט תחתון",
            },
            ar: {
              title: "أنماط النص",
              hint: "اختر اللون والحجم والتنسيق لكل نوع نص بشكل مستقل.",
              reset: "استخدم لون التصميم",
              styleReset: "إعادة ضبط النمط",
              black: "أسود",
              fontSize: "حجم الخط",
              bold: "عريض",
              italic: "مائل",
              underline: "تحته خط",
              brandGroup: "العلامة",
              heroGroup: "الواجهة والعنوان",
              categoriesGroup: "الفئات",
              itemsGroup: "عناصر القائمة",
              footerGroup: "التذييل",
              brandTitle: "اسم المطعم",
              brandSubtitle: "العنوان الفرعي للمطعم",
              heroKicker: "النص الصغير في الواجهة",
              heroTitle: "عنوان الواجهة",
              categoryNav: "تبويبات الفئات",
              sectionTitle: "عنوان الفئة",
              subcategoryTitle: "عنوان الفئة الفرعية",
              itemName: "اسم العنصر",
              description: "الوصف",
              price: "السعر",
              priceType: "نوع السعر",
              note: "ملاحظات الفئة",
              footer: "نص التذييل",
            },
          };

          const ROLE_DEFINITIONS = Object.freeze([
            { key: "brandTitleColor", slug: "brand-title", group: "brandGroup", label: "brandTitle", standardVar: "--bme-brand-title-color", heritageVar: "--ep-brand-title-color", fallback: design => design?.theme?.text || "#121212" },
            { key: "brandSubtitleColor", slug: "brand-subtitle", group: "brandGroup", label: "brandSubtitle", standardVar: "--bme-brand-subtitle-color", heritageVar: "--ep-brand-subtitle-color", fallback: design => design?.theme?.muted || "#7B756E" },
            { key: "heroKickerColor", slug: "hero-kicker", group: "heroGroup", label: "heroKicker", standardVar: "--bme-hero-kicker-color", heritageVar: "--ep-hero-kicker-color", fallback: design => design?.theme?.accent || "#556B2F" },
            { key: "heroTitleColor", slug: "hero-title", group: "heroGroup", label: "heroTitle", standardVar: "--bme-hero-title-color", heritageVar: "--ep-hero-title-color", fallback: design => design?.theme?.text || "#121212" },
            { key: "categoryNavColor", slug: "category-nav", group: "categoriesGroup", label: "categoryNav", standardVar: "--bme-category-nav-color", heritageVar: "--ep-category-nav-color", fallback: design => design?.layout?.navigationStyle === "pills" ? (design?.theme?.text || "#121212") : (design?.theme?.muted || "#7B756E") },
            { key: "sectionTitleColor", slug: "section-title", group: "categoriesGroup", label: "sectionTitle", standardVar: "--bme-section-title-color", heritageVar: "--ep-section-title-color", fallback: design => design?.theme?.text || "#121212" },
            { key: "subcategoryTitleColor", slug: "subcategory-title", group: "categoriesGroup", label: "subcategoryTitle", standardVar: "--bme-subcategory-title-color", heritageVar: "--ep-subcategory-title-color", fallback: design => design?.theme?.text || "#121212" },
            { key: "noteColor", slug: "note", group: "categoriesGroup", label: "note", standardVar: "--bme-note-color", heritageVar: "--ep-note-color", fallback: design => design?.theme?.muted || "#7B756E" },
            { key: "itemNameColor", slug: "item-name", group: "itemsGroup", label: "itemName", standardVar: "--bme-item-name-color", heritageVar: "--ep-item-name-color", fallback: design => design?.theme?.text || "#121212" },
            { key: "descriptionColor", slug: "description", group: "itemsGroup", label: "description", standardVar: "--bme-description-color", heritageVar: "--ep-description-color", fallback: design => design?.theme?.muted || "#7B756E" },
            { key: "priceColor", slug: "price", group: "itemsGroup", label: "price", standardVar: "--bme-price-color", heritageVar: "--ep-price-color", fallback: design => design?.theme?.text || "#121212" },
            { key: "priceTypeColor", slug: "price-type", group: "itemsGroup", label: "priceType", standardVar: "--bme-price-type-color", heritageVar: "--ep-price-type-color", fallback: design => design?.theme?.muted || "#7B756E" },
            { key: "footerColor", slug: "footer", group: "footerGroup", label: "footer", standardVar: "--bme-footer-color", heritageVar: "--ep-footer-color", fallback: design => design?.theme?.muted || "#7B756E" },
          ]);

          const ROLE_GROUPS = Object.freeze(["brandGroup", "heroGroup", "categoriesGroup", "itemsGroup", "footerGroup"]);
          const WORD_FONT_SIZES = Object.freeze([8, 9, 10, 11, 12, 14, 16, 18, 20, 22, 24, 26, 28, 32, 36, 40, 44, 46, 48, 54, 60, 64, 72]);

          function normalizeHex(value) {
            const raw = String(value || "").trim();
            if (/^#[0-9a-fA-F]{6}$/.test(raw)) return raw.toUpperCase();
            if (/^[0-9a-fA-F]{6}$/.test(raw)) return `#${raw.toUpperCase()}`;
            return null;
          }

          function clampTextSize(value) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? Math.min(72, Math.max(8, Math.round(parsed))) : 16;
          }

          function roleSizeFallback(role, design) {
            const type = design?.typography || {};
            const values = {
              "brand-title": type.brandSize || 19,
              "brand-subtitle": type.categorySize || 11,
              "hero-kicker": type.categorySize || 11,
              "hero-title": type.heroSize || 46,
              "category-nav": type.categorySize || 11,
              "section-title": type.sectionSize || 38,
              "subcategory-title": type.itemNameSize || 16,
              "note": type.descriptionSize || 11,
              "item-name": type.itemNameSize || 16,
              description: type.descriptionSize || 11,
              price: type.priceSize || 16,
              "price-type": type.descriptionSize || 11,
              footer: type.categorySize || 11,
            };
            return clampTextSize(values[role.slug]);
          }

          function roleBoldFallback(role, design) {
            const type = design?.typography || {};
            if (["brand-title", "hero-title", "section-title", "subcategory-title"].includes(role.slug)) return Number(type.headingWeight || 700) >= 600;
            if (["item-name", "price"].includes(role.slug)) return Number(type.itemWeight || 700) >= 600;
            return false;
          }

          function storedRoleStyle(role, design) {
            const value = design?.typography?.roles?.[role.slug];
            return value && typeof value === "object" && !Array.isArray(value) ? value : {};
          }

          function resolvedRoleStyle(role, design) {
            const stored = storedRoleStyle(role, design);
            return {
              size: Object.prototype.hasOwnProperty.call(stored, "size") ? clampTextSize(stored.size) : roleSizeFallback(role, design),
              bold: typeof stored.bold === "boolean" ? stored.bold : roleBoldFallback(role, design),
              italic: typeof stored.italic === "boolean" ? stored.italic : false,
              underline: typeof stored.underline === "boolean" ? stored.underline : false,
            };
          }

          function previewDocuments() {
            if (typeof document === "undefined") return [];
            const documents = [document];
            document.querySelectorAll("iframe.studio-v3-design-device-iframe").forEach((frame) => {
              try {
                if (frame.contentDocument) documents.push(frame.contentDocument);
              } catch {
                // Studio preview iframes are same-origin; ignore a transient reload.
              }
            });
            return documents;
          }

          function syncStudioPreviewRole(role, color, enabled = true) {
            previewDocuments().forEach((targetDocument) => {
              targetDocument.querySelectorAll(".bme-menu,.bme-heritage-exact").forEach((root) => {
                const heritage = root.classList.contains("bme-heritage-exact");
                const variable = heritage ? role.heritageVar : role.standardVar;
                const className = `bme-custom-color-${role.slug}`;
                if (enabled) {
                  root.classList.add(className);
                  root.style.setProperty(variable, color);
                } else {
                  root.classList.remove(className);
                  root.style.removeProperty(variable);
                }
              });
            });
          }

          function syncStudioPreviewTypographyRole(role, stored = {}) {
            const keys = ["size", "bold", "italic", "underline"];
            const enabled = keys.some((key) => Object.prototype.hasOwnProperty.call(stored, key));
            previewDocuments().forEach((targetDocument) => {
              targetDocument.querySelectorAll(".bme-menu,.bme-heritage-exact").forEach((root) => {
                const prefix = root.classList.contains("bme-heritage-exact") ? "ep" : "bme";
                const className = `bme-custom-type-${role.slug}`;
                const variables = {
                  size: `--${prefix}-${role.slug}-size`,
                  bold: `--${prefix}-${role.slug}-weight`,
                  italic: `--${prefix}-${role.slug}-style`,
                  underline: `--${prefix}-${role.slug}-decoration`,
                };
                if (!enabled) {
                  root.classList.remove(className);
                  Object.values(variables).forEach((variable) => root.style.removeProperty(variable));
                  return;
                }
                root.classList.add(className);
                if (Object.prototype.hasOwnProperty.call(stored, "size")) root.style.setProperty(variables.size, `${clampTextSize(stored.size)}px`); else root.style.removeProperty(variables.size);
                if (Object.prototype.hasOwnProperty.call(stored, "bold")) root.style.setProperty(variables.bold, stored.bold ? "700" : "400"); else root.style.removeProperty(variables.bold);
                if (Object.prototype.hasOwnProperty.call(stored, "italic")) root.style.setProperty(variables.italic, stored.italic ? "italic" : "normal"); else root.style.removeProperty(variables.italic);
                if (Object.prototype.hasOwnProperty.call(stored, "underline")) root.style.setProperty(variables.underline, stored.underline ? "underline" : "none"); else root.style.removeProperty(variables.underline);
              });
            });
          }

          function TextStyleField({ role, design, t, patchDesign }) {
            const custom = normalizeHex(design?.theme?.[role.key]);
            const fallback = normalizeHex(role.fallback(design)) || "#121212";
            const value = custom || fallback;
            const storedStyle = storedRoleStyle(role, design);
            const style = resolvedRoleStyle(role, design);
            const hasCustomStyle = ["size", "bold", "italic", "underline"].some((key) => Object.prototype.hasOwnProperty.call(storedStyle, key));
            const [hexDraft, setHexDraft] = useState(value);
            const fontSizes = [...new Set([...WORD_FONT_SIZES, style.size])].sort((a, b) => a - b);

            useEffect(() => {
              setHexDraft(value);
              syncStudioPreviewRole(role, value, Boolean(custom));
              syncStudioPreviewTypographyRole(role, storedStyle);
              const frame = window.requestAnimationFrame(() => {
                syncStudioPreviewRole(role, value, Boolean(custom));
                syncStudioPreviewTypographyRole(role, storedStyle);
              });
              const timer = window.setTimeout(() => {
                syncStudioPreviewRole(role, value, Boolean(custom));
                syncStudioPreviewTypographyRole(role, storedStyle);
              }, 120);
              return () => {
                window.cancelAnimationFrame(frame);
                window.clearTimeout(timer);
              };
            }, [custom, value, role, storedStyle.size, storedStyle.bold, storedStyle.italic, storedStyle.underline]);

            function setColor(nextColor) {
              const normalized = normalizeHex(nextColor);
              if (!normalized) return;
              syncStudioPreviewRole(role, normalized, true);
              patchDesign((current) => ({
                ...current,
                theme: { ...current.theme, [role.key]: normalized },
              }));
            }

            function commitHex() {
              const normalized = normalizeHex(hexDraft);
              if (normalized) {
                setColor(normalized);
                setHexDraft(normalized);
              } else {
                setHexDraft(value);
              }
            }

            function resetColor() {
              syncStudioPreviewRole(role, fallback, false);
              patchDesign((current) => {
                const theme = { ...current.theme };
                delete theme[role.key];
                return { ...current, theme };
              });
            }

            function patchTypographyStyle(nextPatch) {
              const nextStored = { ...storedRoleStyle(role, design), ...nextPatch };
              syncStudioPreviewTypographyRole(role, nextStored);
              patchDesign((current) => {
                const typography = { ...current.typography };
                const roles = { ...(typography.roles || {}) };
                roles[role.slug] = { ...(roles[role.slug] || {}), ...nextPatch };
                typography.roles = roles;
                return { ...current, typography };
              });
            }

            function resetTypographyStyle() {
              syncStudioPreviewTypographyRole(role, {});
              patchDesign((current) => {
                const typography = { ...current.typography };
                const roles = { ...(typography.roles || {}) };
                delete roles[role.slug];
                typography.roles = roles;
                return { ...current, typography };
              });
            }

            return (
              <div className="menu-text-style-field">
                <span className="menu-text-style-label">{t[role.label]}</span>
                <div className="menu-text-style-toolbar">
                  <label className="menu-text-color-picker" title={t[role.label]}>
                    <input className="menu-text-color-native" type="color" value={value} onChange={(event) => setColor(event.target.value)} aria-label={t[role.label]} />
                    <span className="menu-text-color-swatch" style={{ background: value }} aria-hidden="true" />
                    <input
                      className="menu-text-color-hex"
                      type="text"
                      value={hexDraft}
                      inputMode="text"
                      spellCheck="false"
                      maxLength={7}
                      onChange={(event) => setHexDraft(event.target.value.toUpperCase())}
                      onBlur={commitHex}
                      onKeyDown={(event) => {
                        if (event.key === "Enter") {
                          event.preventDefault();
                          commitHex();
                          event.currentTarget.blur();
                        }
                      }}
                      aria-label={`${t[role.label]} hex`}
                    />
                  </label>

                  <label className="menu-text-size-control" title={t.fontSize}>
                    <select value={style.size} onChange={(event) => patchTypographyStyle({ size: Number(event.target.value) })} aria-label={`${t[role.label]} ${t.fontSize}`}>
                      {fontSizes.map((size) => <option key={size} value={size}>{size}</option>)}
                    </select>
                  </label>

                  <div className="menu-text-format-buttons" role="group" aria-label={t[role.label]}>
                    <button type="button" className={style.bold ? "active" : ""} aria-pressed={style.bold} title={t.bold} aria-label={t.bold} onClick={() => patchTypographyStyle({ bold: !style.bold })}><strong>B</strong></button>
                    <button type="button" className={style.italic ? "active" : ""} aria-pressed={style.italic} title={t.italic} aria-label={t.italic} onClick={() => patchTypographyStyle({ italic: !style.italic })}><em>I</em></button>
                    <button type="button" className={style.underline ? "active" : ""} aria-pressed={style.underline} title={t.underline} aria-label={t.underline} onClick={() => patchTypographyStyle({ underline: !style.underline })}><u>U</u></button>
                  </div>
                </div>

                <div className="menu-text-style-actions">
                  <button type="button" onClick={() => setColor("#000000")}>{t.black}</button>
                  <button type="button" onClick={resetColor} disabled={!custom}>{t.reset}</button>
                  <button type="button" onClick={resetTypographyStyle} disabled={!hasCustomStyle}>{t.styleReset}</button>
                </div>
              </div>
            );
          }

          export default function MenuItemNameColorControl({ design, language = "en", patchDesign }) {
            const t = COPY[language] || COPY.en;
            return (
              <section className="menu-item-name-color-control menu-text-styles-control" aria-label={t.title}>
                <div className="menu-item-name-color-copy">
                  <strong>{t.title}</strong>
                  <small>{t.hint}</small>
                </div>
                <div className="menu-text-style-groups">
                  {ROLE_GROUPS.map((group) => (
                    <section className="menu-text-style-group" key={group}>
                      <div className="menu-text-style-group-title">{t[group]}</div>
                      <div className="menu-text-styles-list">
                        {ROLE_DEFINITIONS.filter((role) => role.group === group).map((role) => (
                          <TextStyleField key={role.key} role={role} design={design} t={t} patchDesign={patchDesign} />
                        ))}
                      </div>
                    </section>
                  ))}
                </div>
              </section>
            );
          }
          EOF

          cat > frontend/src/features/menu-engine/studio/MenuItemNameColorControl.css <<'EOF'
          .menu-item-name-color-control{
            display:grid;
            gap:14px;
            margin:0 14px 14px;
            padding:15px;
            border:1px solid rgba(60,60,67,.12);
            border-radius:17px;
            background:#fff;
          }
          .menu-item-name-color-copy{display:grid;gap:4px}
          .menu-item-name-color-copy strong{color:#343438;font-size:12px;font-weight:740}
          .menu-item-name-color-copy small{color:#8a8a8f;font-size:10px;line-height:1.45}
          .menu-text-style-groups{display:grid;gap:14px}
          .menu-text-style-group{display:grid;gap:7px}
          .menu-text-style-group-title{padding:0 1px 6px;color:#343438;font-size:11px;font-weight:800;border-bottom:1px solid rgba(60,60,67,.1)}
          .menu-text-styles-list{display:grid;gap:0}
          .menu-text-style-field{display:grid;gap:7px;padding:10px 0;border-bottom:1px solid rgba(60,60,67,.075)}
          .menu-text-style-field:last-child{border-bottom:0}
          .menu-text-style-label{color:#56565b;font-size:10px;font-weight:720}
          .menu-text-style-toolbar{display:grid;grid-template-columns:minmax(105px,1fr) 58px auto;gap:6px;align-items:center}
          .menu-text-color-picker{min-width:0;height:38px;display:grid;grid-template-columns:26px minmax(0,1fr);align-items:center;gap:7px;padding:5px 8px;border:1px solid rgba(60,60,67,.13);border-radius:10px;background:#f7f7f9;cursor:pointer;position:relative}
          .menu-text-color-native{position:absolute;left:7px;top:5px;width:26px;height:26px;opacity:0;cursor:pointer;z-index:2}
          .menu-text-color-swatch{width:26px;height:26px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);pointer-events:none}
          .menu-text-color-hex{min-width:0;width:100%;height:26px;padding:0;border:0;outline:0;background:transparent;color:#4d4d52;font:650 10px/1.2 Inter,sans-serif;text-transform:uppercase}
          .menu-text-size-control{display:block}
          .menu-text-size-control select{width:100%;height:38px;padding:0 6px;border:1px solid rgba(60,60,67,.13);border-radius:10px;background:#fff;color:#343438;font:700 11px/1 Inter,sans-serif;outline:none;cursor:pointer;text-align:center}
          .menu-text-format-buttons{display:flex;gap:4px;align-items:center}
          .menu-text-format-buttons button{width:34px;height:38px;display:grid;place-items:center;padding:0;border:1px solid rgba(60,60,67,.13);border-radius:9px;background:#fff;color:#343438;font:700 12px/1 Inter,sans-serif;cursor:pointer}
          .menu-text-format-buttons button em{font-family:Georgia,serif;font-size:14px}
          .menu-text-format-buttons button u{text-underline-offset:2px}
          .menu-text-format-buttons button.active{border-color:#80a2fb;background:#edf3ff;color:#3569e8;box-shadow:0 0 0 1px rgba(73,116,229,.08)}
          .menu-text-style-actions{display:flex;gap:5px;flex-wrap:wrap}
          .menu-text-style-actions button{min-height:28px;padding:0 8px;border:1px solid rgba(60,60,67,.11);border-radius:8px;background:#fff;color:#4974e5;font-size:9px;font-weight:700;cursor:pointer;white-space:nowrap}
          .menu-text-style-actions button:disabled{opacity:.35;cursor:not-allowed}

          html[data-beyond-theme="dark"] .menu-item-name-color-control{border-color:rgba(255,255,255,.11);background:#151c24}
          html[data-beyond-theme="dark"] .menu-item-name-color-copy strong,
          html[data-beyond-theme="dark"] .menu-text-style-group-title{color:#eef2f7}
          html[data-beyond-theme="dark"] .menu-item-name-color-copy small{color:#929ba7}
          html[data-beyond-theme="dark"] .menu-text-style-label{color:#cbd3dd}
          html[data-beyond-theme="dark"] .menu-text-style-group-title,
          html[data-beyond-theme="dark"] .menu-text-style-field{border-color:rgba(255,255,255,.08)}
          html[data-beyond-theme="dark"] .menu-text-color-picker,
          html[data-beyond-theme="dark"] .menu-text-size-control select,
          html[data-beyond-theme="dark"] .menu-text-format-buttons button,
          html[data-beyond-theme="dark"] .menu-text-style-actions button{border-color:rgba(255,255,255,.11);background:#1b222b;color:#e4e9ef}
          html[data-beyond-theme="dark"] .menu-text-color-hex{color:#e4e9ef}
          html[data-beyond-theme="dark"] .menu-text-format-buttons button.active{border-color:#7898ec;background:#223153;color:#a9bcff}
          html[data-beyond-theme="dark"] .menu-text-style-actions button{color:#91aaff}

          @media(max-width:600px){
            .menu-text-style-toolbar{grid-template-columns:minmax(96px,1fr) 56px auto}
            .menu-text-format-buttons button{width:32px}
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          import re

          controls_path = Path("frontend/src/features/menu-engine/studio/MenuDesignControls.jsx")
          controls = controls_path.read_text()
          start_marker = '        {panel==="type"?'
          end_marker = '        {panel==="layout"?'
          start = controls.find(start_marker)
          end = controls.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate Text panel markers")
          new_type_panel = '''        {panel==="type"?<div className="studio-v3-design-section studio-v3-inspector-panel"><section className="studio-v3-inspector-block"><div className="studio-v3-inspector-block-title"><span>{t.fonts}</span></div><div className="studio-v3-font-grid"><FontField label={t.headingFont} value={design.typography.headingFont} onChange={value=>patchType("headingFont",value)}/><FontField label={t.bodyFont} value={design.typography.bodyFont} onChange={value=>patchType("bodyFont",value)}/></div></section></div>:null}\n\n'''
          controls = controls[:start] + new_type_panel + controls[end:]
          controls_path.write_text(controls)

          renderer_path = Path("frontend/src/features/menu-engine/renderer/MenuRenderer.jsx")
          renderer = renderer_path.read_text()
          old_helpers = re.compile(r'function textRoleVariables\(prefix,theme=\{\}\)\{.*?\}\nfunction textRoleClasses\(theme=\{\}\)\{.*?\}\n', re.S)
          new_helpers = '''function textRoleVariables(prefix,theme={}){const variables={};Object.entries(TEXT_ROLE_COLORS).forEach(([key,slug])=>{const value=String(theme?.[key]||"").trim();if(value)variables[`--${prefix}-${slug}-color`]=value;});return variables;}\nfunction textRoleTypeVariables(prefix,typography={}){const variables={};const roles=typography?.roles&&typeof typography.roles==="object"&&!Array.isArray(typography.roles)?typography.roles:{};const allowed=new Set(Object.values(TEXT_ROLE_COLORS));Object.entries(roles).forEach(([slug,style])=>{if(!allowed.has(slug)||!style||typeof style!=="object"||Array.isArray(style))return;if(Object.prototype.hasOwnProperty.call(style,"size")){const size=Math.min(72,Math.max(8,Number(style.size)||16));variables[`--${prefix}-${slug}-size`]=`${size}px`;}if(typeof style.bold==="boolean")variables[`--${prefix}-${slug}-weight`]=style.bold?700:400;if(typeof style.italic==="boolean")variables[`--${prefix}-${slug}-style`]=style.italic?"italic":"normal";if(typeof style.underline==="boolean")variables[`--${prefix}-${slug}-decoration`]=style.underline?"underline":"none";});return variables;}\nfunction textRoleClasses(design={}){const theme=design?.theme||{};const typography=design?.typography||{};const colorClasses=Object.entries(TEXT_ROLE_COLORS).filter(([key])=>String(theme?.[key]||"").trim()).map(([,slug])=>`bme-custom-color-${slug}`);const allowed=new Set(Object.values(TEXT_ROLE_COLORS));const roles=typography?.roles&&typeof typography.roles==="object"&&!Array.isArray(typography.roles)?typography.roles:{};const typeClasses=Object.entries(roles).filter(([slug,style])=>allowed.has(slug)&&style&&typeof style==="object"&&!Array.isArray(style)&&["size","bold","italic","underline"].some(key=>Object.prototype.hasOwnProperty.call(style,key))).map(([slug])=>`bme-custom-type-${slug}`);return [...colorClasses,...typeClasses].join(" ");}\n'''
          renderer, count = old_helpers.subn(new_helpers, renderer, count=1)
          if count != 1:
              raise SystemExit(f"Expected one renderer helper block, got {count}")
          renderer = renderer.replace('...textRoleVariables("bme",design.theme),"--bme-heading-font"', '...textRoleVariables("bme",design.theme),...textRoleTypeVariables("bme",design.typography),"--bme-heading-font"', 1)
          renderer = renderer.replace('...textRoleVariables("ep",design.theme),"--ep-heading-font"', '...textRoleVariables("ep",design.theme),...textRoleTypeVariables("ep",design.typography),"--ep-heading-font"', 1)
          renderer = renderer.replace('textRoleClasses(design.theme)', 'textRoleClasses(design)')
          renderer_path.write_text(renderer)

          css_path = Path("frontend/src/features/menu-engine/renderer/menuTextRoleColors.css")
          css = css_path.read_text()
          marker = "/* Per-text-role typography overrides. */"
          if marker not in css:
              css += r'''

          /* Per-text-role typography overrides. */
          .bme-custom-type-brand-title .bme-brand strong,
          .bme-custom-type-brand-title .ep-brand-title{font-size:var(--bme-brand-title-size,var(--ep-brand-title-size))!important;font-weight:var(--bme-brand-title-weight,var(--ep-brand-title-weight))!important;font-style:var(--bme-brand-title-style,var(--ep-brand-title-style))!important;text-decoration:var(--bme-brand-title-decoration,var(--ep-brand-title-decoration))!important}
          .bme-custom-type-brand-subtitle .bme-brand span,
          .bme-custom-type-brand-subtitle .ep-brand-sub{font-size:var(--bme-brand-subtitle-size,var(--ep-brand-subtitle-size))!important;font-weight:var(--bme-brand-subtitle-weight,var(--ep-brand-subtitle-weight))!important;font-style:var(--bme-brand-subtitle-style,var(--ep-brand-subtitle-style))!important;text-decoration:var(--bme-brand-subtitle-decoration,var(--ep-brand-subtitle-decoration))!important}
          .bme-custom-type-hero-kicker .bme-hero-copy>span,
          .bme-custom-type-hero-kicker .ep-hero-kicker{font-size:var(--bme-hero-kicker-size,var(--ep-hero-kicker-size))!important;font-weight:var(--bme-hero-kicker-weight,var(--ep-hero-kicker-weight))!important;font-style:var(--bme-hero-kicker-style,var(--ep-hero-kicker-style))!important;text-decoration:var(--bme-hero-kicker-decoration,var(--ep-hero-kicker-decoration))!important}
          .bme-custom-type-hero-title .bme-hero-copy h1,
          .bme-custom-type-hero-title .ep-hero-title{font-size:var(--bme-hero-title-size,var(--ep-hero-title-size))!important;font-weight:var(--bme-hero-title-weight,var(--ep-hero-title-weight))!important;font-style:var(--bme-hero-title-style,var(--ep-hero-title-style))!important;text-decoration:var(--bme-hero-title-decoration,var(--ep-hero-title-decoration))!important}
          .bme-custom-type-category-nav .bme-category-nav button,
          .bme-custom-type-category-nav .bme-category-nav button.active,
          .bme-custom-type-category-nav .ep-tabs button,
          .bme-custom-type-category-nav .ep-tabs button.active{font-size:var(--bme-category-nav-size,var(--ep-category-nav-size))!important;font-weight:var(--bme-category-nav-weight,var(--ep-category-nav-weight))!important;font-style:var(--bme-category-nav-style,var(--ep-category-nav-style))!important;text-decoration:var(--bme-category-nav-decoration,var(--ep-category-nav-decoration))!important}
          .bme-custom-type-section-title .bme-section-heading h2,
          .bme-custom-type-section-title .ep-section-head h2{font-size:var(--bme-section-title-size,var(--ep-section-title-size))!important;font-weight:var(--bme-section-title-weight,var(--ep-section-title-weight))!important;font-style:var(--bme-section-title-style,var(--ep-section-title-style))!important;text-decoration:var(--bme-section-title-decoration,var(--ep-section-title-decoration))!important}
          .bme-custom-type-subcategory-title .bme-subcategory-heading h3,
          .bme-custom-type-subcategory-title .ep-item-category{font-size:var(--bme-subcategory-title-size,var(--ep-subcategory-title-size))!important;font-weight:var(--bme-subcategory-title-weight,var(--ep-subcategory-title-weight))!important;font-style:var(--bme-subcategory-title-style,var(--ep-subcategory-title-style))!important;text-decoration:var(--bme-subcategory-title-decoration,var(--ep-subcategory-title-decoration))!important}
          .bme-custom-type-item-name .bme-item-copy h3,
          .bme-custom-type-item-name .bme-visual-copy h3,
          .bme-custom-type-item-name .ep-item-name{font-size:var(--bme-item-name-size,var(--ep-item-name-size))!important;font-weight:var(--bme-item-name-weight,var(--ep-item-name-weight))!important;font-style:var(--bme-item-name-style,var(--ep-item-name-style))!important;text-decoration:var(--bme-item-name-decoration,var(--ep-item-name-decoration))!important}
          .bme-custom-type-description .bme-item-copy p,
          .bme-custom-type-description .ep-item-description{font-size:var(--bme-description-size,var(--ep-description-size))!important;font-weight:var(--bme-description-weight,var(--ep-description-weight))!important;font-style:var(--bme-description-style,var(--ep-description-style))!important;text-decoration:var(--bme-description-decoration,var(--ep-description-decoration))!important}
          .bme-custom-type-price .bme-price,
          .bme-custom-type-price .bme-price-option strong,
          .bme-custom-type-price .ep-item-price,
          .bme-custom-type-price .ep-price-option strong,
          .bme-custom-type-price .ep-dual-price strong{font-size:var(--bme-price-size,var(--ep-price-size))!important;font-weight:var(--bme-price-weight,var(--ep-price-weight))!important;font-style:var(--bme-price-style,var(--ep-price-style))!important;text-decoration:var(--bme-price-decoration,var(--ep-price-decoration))!important}
          .bme-custom-type-price-type .bme-price-option small,
          .bme-custom-type-price-type .ep-price-option small,
          .bme-custom-type-price-type .ep-dual-price small{font-size:var(--bme-price-type-size,var(--ep-price-type-size))!important;font-weight:var(--bme-price-type-weight,var(--ep-price-type-weight))!important;font-style:var(--bme-price-type-style,var(--ep-price-type-style))!important;text-decoration:var(--bme-price-type-decoration,var(--ep-price-type-decoration))!important}
          .bme-custom-type-note .bme-group-note,
          .bme-custom-type-note .ep-group-note{font-size:var(--bme-note-size,var(--ep-note-size))!important;font-weight:var(--bme-note-weight,var(--ep-note-weight))!important;font-style:var(--bme-note-style,var(--ep-note-style))!important;text-decoration:var(--bme-note-decoration,var(--ep-note-decoration))!important}
          .bme-custom-type-footer .bme-footer,
          .bme-custom-type-footer .bme-footer button,
          .bme-custom-type-footer .bme-footer strong,
          .bme-custom-type-footer .bme-footer span,
          .bme-custom-type-footer .ep-footer,
          .bme-custom-type-footer .ep-footer-responsible,
          .bme-custom-type-footer .ep-accessibility-statement-link,
          .bme-custom-type-footer .ep-footer span,
          .bme-custom-type-footer .ep-footer strong{font-size:var(--bme-footer-size,var(--ep-footer-size))!important;font-weight:var(--bme-footer-weight,var(--ep-footer-weight))!important;font-style:var(--bme-footer-style,var(--ep-footer-style))!important;text-decoration:var(--bme-footer-decoration,var(--ep-footer-decoration))!important}
          '''
          css_path.write_text(css)
          PY

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit text style editor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Beyond UI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/features/menu-engine/studio/MenuDesignControls.jsx \
                  frontend/src/features/menu-engine/studio/MenuItemNameColorControl.jsx \
                  frontend/src/features/menu-engine/studio/MenuItemNameColorControl.css \
                  frontend/src/features/menu-engine/renderer/MenuRenderer.jsx \
                  frontend/src/features/menu-engine/renderer/menuTextRoleColors.css
          git diff --cached --quiet && exit 0
          git commit -m "Add Word-style per-role text controls"
          git push origin HEAD:studio-mobile-remodel-development
