name: Temporary original photo lock patch

on:
  push:
    branches:
      - studio-mobile-remodel-development
    paths:
      - .github/workflows/temporary-lock-original-photo.yml

permissions:
  contents: write

jobs:
  patch-original-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio-mobile-remodel-development
          fetch-depth: 0

      - name: Preserve true uploaded original and remove generic download
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing patch anchor: {label}")
              return text.replace(old, new, 1)

          path = Path("frontend/src/components/MenuContentImageEditor.jsx")
          text = path.read_text()

          text = replace_once(
              text,
              '    optionsTitle: "Created options", optionsHint: "Your original photo and every AI result are kept here. Choose the one you want to use.", optionLabel: "Option", originalOption: "Original", download: "Download photo",\n',
              '    optionsTitle: "Created options", optionsHint: "Your original photo and every AI result are kept here. Choose the one you want to use.", optionLabel: "Option", originalOption: "Original", originalMissing: "Original needs re-upload", originalMissingHint: "This older item did not preserve the untouched upload. Re-upload the original once to lock it permanently.", download: "Download photo",\n',
              "english original copy",
          )
          text = replace_once(
              text,
              '    optionsTitle: "אפשרויות שנוצרו", optionsHint: "התמונה המקורית וכל תוצאת AI נשמרות כאן. בחרו את התמונה שבה תרצו להשתמש.", optionLabel: "אפשרות", originalOption: "מקור", download: "הורדת תמונה",\n',
              '    optionsTitle: "אפשרויות שנוצרו", optionsHint: "התמונה המקורית וכל תוצאת AI נשמרות כאן. בחרו את התמונה שבה תרצו להשתמש.", optionLabel: "אפשרות", originalOption: "מקור", originalMissing: "יש להעלות מחדש את המקור", originalMissingHint: "בפריט ישן זה התמונה המקורית שלא נערכה לא נשמרה בנפרד. העלו אותה מחדש פעם אחת כדי לנעול אותה לצמיתות.", download: "הורדת תמונה",\n',
              "hebrew original copy",
          )
          text = replace_once(
              text,
              '    optionsTitle: "الخيارات التي تم إنشاؤها", optionsHint: "يتم الاحتفاظ بالصورة الأصلية وكل نتيجة AI هنا. اختر الصورة التي تريد استخدامها.", optionLabel: "خيار", originalOption: "الأصل", download: "تنزيل الصورة",\n',
              '    optionsTitle: "الخيارات التي تم إنشاؤها", optionsHint: "يتم الاحتفاظ بالصورة الأصلية وكل نتيجة AI هنا. اختر الصورة التي تريد استخدامها.", optionLabel: "خيار", originalOption: "الأصل", originalMissing: "يجب إعادة رفع الصورة الأصلية", originalMissingHint: "هذا العنصر القديم لم يحتفظ بالنسخة الأصلية غير المعدلة بشكل منفصل. أعد رفعها مرة واحدة ليتم حفظها بشكل دائم.", download: "تنزيل الصورة",\n',
              "arabic original copy",
          )

          old_source = '''  const sourceUrl = item.image_original_url || item.image_url || "";\n  const sourcePath = item.image_original_path || item.image_path || "";\n'''
          new_source = '''  // Keep the customer's untouched upload separate from menu/AI derivatives.\n  // New uploads always populate image_upload_original_* and AI generations must\n  // branch from that immutable source instead of from a previously generated option.\n  const immutableOriginalUrl = String(item.image_upload_original_url || "").trim();\n  const immutableOriginalPath = String(item.image_upload_original_path || "").trim();\n  const legacyOriginalUrl = String(item.image_original_url || "").trim();\n  const legacyOriginalPath = String(item.image_original_path || "").trim();\n  const savedOptions = optionsFromItem(item);\n  const legacyOriginalTrusted = Boolean(\n    legacyOriginalUrl\n      && (legacyOriginalUrl !== String(item.image_url || "").trim() || !savedOptions.length),\n  );\n  const originalUrl = immutableOriginalUrl || (legacyOriginalTrusted ? legacyOriginalUrl : "");\n  const originalPath = immutableOriginalPath || (legacyOriginalTrusted ? legacyOriginalPath : "");\n  const sourceUrl = immutableOriginalUrl || legacyOriginalUrl || item.image_url || "";\n  const sourcePath = immutableOriginalPath || legacyOriginalPath || item.image_path || "";\n  const originalNeedsRepair = Boolean(!originalUrl && savedOptions.length && legacyOriginalUrl);\n'''
          text = replace_once(text, old_source, new_source, "immutable source fields")

          text = replace_once(
              text,
              '        item.image_path,\n        item.image_original_path,\n        item.image_processed_path,\n',
              '        item.image_path,\n        item.image_upload_original_path,\n        item.image_original_path,\n        item.image_processed_path,\n',
              "replace-photo cleanup includes immutable original",
          )
          text = replace_once(
              text,
              '        image_original_url: uploaded.image_url,\n        image_original_path: uploaded.image_path,\n',
              '        image_upload_original_url: uploaded.image_url,\n        image_upload_original_path: uploaded.image_path,\n        image_original_url: uploaded.image_url,\n        image_original_path: uploaded.image_path,\n',
              "write immutable original on upload",
          )

          text = replace_once(
              text,
              '  async function generatePreview() {\n    if (!sourceUrl || processing) return;\n',
              '  async function generatePreview() {\n    if (!sourceUrl || processing) return;\n    if (originalNeedsRepair) {\n      setError(copy.originalMissingHint);\n      return;\n    }\n',
              "block AI-on-corrupted-legacy-source",
          )

          # Second occurrence is removeImage cleanup; the first was replaced above.
          anchor = '        item.image_path,\n        item.image_original_path,\n        item.image_processed_path,\n'
          if anchor not in text:
              raise SystemExit("Missing patch anchor: remove-image cleanup includes immutable original")
          text = text.replace(
              anchor,
              '        item.image_path,\n        item.image_upload_original_path,\n        item.image_original_path,\n        item.image_processed_path,\n',
              1,
          )
          text = replace_once(
              text,
              '      onChange?.({ image_url: "", image_path: "", image_original_url: "", image_original_path: "", image_processed_url: "", image_processed_path: "", image_variant: "", image_ai_mode: "", image_ai_model: "", image_ai_scene: "", image_ai_style: null, image_ai_options: [] });\n',
              '      onChange?.({ image_url: "", image_path: "", image_upload_original_url: "", image_upload_original_path: "", image_original_url: "", image_original_path: "", image_processed_url: "", image_processed_path: "", image_variant: "", image_ai_mode: "", image_ai_model: "", image_ai_scene: "", image_ai_style: null, image_ai_options: [] });\n',
              "clear immutable source on remove",
          )

          text = replace_once(
              text,
              '  function chooseOriginal() {\n    if (!sourceUrl || busy) return;\n    setResult({ id: "original", url: sourceUrl, path: sourcePath, isOriginal: true });\n',
              '  function chooseOriginal() {\n    if (!originalUrl || busy) return;\n    setResult({ id: "original", url: originalUrl, path: originalPath, isOriginal: true });\n',
              "choose true original",
          )
          text = replace_once(
              text,
              '    const currentIsOriginal = Boolean(sourceUrl && item.image_url === sourceUrl && !item.image_processed_path);\n    const selected = currentIsOriginal\n      ? { id: "original", url: sourceUrl, path: sourcePath, isOriginal: true }\n',
              '    const currentIsOriginal = Boolean(originalUrl && item.image_url === originalUrl && !item.image_processed_path);\n    const selected = currentIsOriginal\n      ? { id: "original", url: originalUrl, path: originalPath, isOriginal: true }\n',
              "open studio original selection",
          )

          old_card = '''                <div\n                  className={`menu-content-v2-photo-variant-card original ${result?.isOriginal || (!result && !results.length) ? "active" : ""}`}\n                  role="button"\n                  tabIndex={busy ? -1 : 0}\n                  aria-label={copy.originalOption}\n                  onClick={chooseOriginal}\n                  onKeyDown={(event) => { if (!busy && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); chooseOriginal(); } }}\n                >\n                  <img src={sourceUrl} alt="" />\n                  <button type="button" className="menu-content-v2-photo-variant-download" disabled={busy} aria-label={`${copy.download} — ${copy.originalOption}`} onClick={(event) => { event.stopPropagation(); downloadPhotoUrl(sourceUrl, `${itemDisplayName(item, language) || "menu-item"}-original`); }}>\n                    <Download size={12} />\n                  </button>\n                  <span><span>{copy.originalOption}</span>{result?.isOriginal || (!result && !results.length) ? <i className="selected-mark"><Check size={11} /></i> : null}</span>\n                </div>\n'''
          new_card = '''                {originalUrl ? <div\n                  className={`menu-content-v2-photo-variant-card original ${result?.isOriginal || (!result && !results.length) ? "active" : ""}`}\n                  role="button"\n                  tabIndex={busy ? -1 : 0}\n                  aria-label={copy.originalOption}\n                  onClick={chooseOriginal}\n                  onKeyDown={(event) => { if (!busy && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); chooseOriginal(); } }}\n                >\n                  <img src={originalUrl} alt="" />\n                  <button type="button" className="menu-content-v2-photo-variant-download" disabled={busy} aria-label={`${copy.download} — ${copy.originalOption}`} onClick={(event) => { event.stopPropagation(); downloadPhotoUrl(originalUrl, `${itemDisplayName(item, language) || "menu-item"}-original`); }}>\n                    <Download size={12} />\n                  </button>\n                  <span><span>{copy.originalOption}</span>{result?.isOriginal || (!result && !results.length) ? <i className="selected-mark"><Check size={11} /></i> : null}</span>\n                </div> : originalNeedsRepair ? <div className="menu-content-v2-photo-variant-card original-missing" aria-label={copy.originalMissing}>\n                  <span className="original-missing-icon"><ImagePlus size={18} /></span>\n                  <span><span>{copy.originalMissing}</span></span>\n                  <small>{copy.originalMissingHint}</small>\n                </div> : null}\n'''
          text = replace_once(text, old_card, new_card, "original gallery card")

          text = replace_once(
              text,
              '          image_url: sourceUrl,\n          image_path: sourcePath,\n          image_original_url: sourceUrl,\n          image_original_path: sourcePath,\n',
              '          image_url: originalUrl || sourceUrl,\n          image_path: originalPath || sourcePath,\n          image_upload_original_url: immutableOriginalUrl || originalUrl || "",\n          image_upload_original_path: immutableOriginalPath || originalPath || "",\n          image_original_url: originalUrl || sourceUrl,\n          image_original_path: originalPath || sourcePath,\n',
              "restore immutable original when selected",
          )

          path.write_text(text)

          css_path = Path("frontend/src/components/MenuContentImageStyleMatch.css")
          css = css_path.read_text()
          css += '''\n/* immutable original-photo recovery */\n.menu-content-v2-photo-variant-card.original-missing{\n  min-height:104px;align-content:center;justify-items:center;text-align:center;cursor:default;\n  border-style:dashed;background:var(--beyond-studio-surface-2,#f7f8fa);color:var(--beyond-studio-muted,#738096);\n}\n.menu-content-v2-photo-variant-card.original-missing .original-missing-icon{\n  width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(73,116,229,.08);color:#4974e5;\n}\n.menu-content-v2-photo-variant-card.original-missing>small{padding:0 4px 5px;font-size:7px;line-height:1.3;color:inherit}\nhtml[data-beyond-theme="dark"] .menu-content-v2-photo-variant-card.original-missing{background:#151e29;color:#9eaaba;border-color:rgba(255,255,255,.16)}\n'''
          css_path.write_text(css)

          download_path = Path("frontend/src/pages/menuContentImageDownload.js")
          download = download_path.read_text()
          old_download = '''  const editor = document.querySelector(".menu-content-v2-image-editor");\n  if (!editor) return;\n\n  const draft = readMenuStudioV2Draft();\n  const item = selectedItemFromDraft(draft);\n  const hasPhoto = Boolean(fullPhotoUrl(item));\n\n  let button = editor.querySelector(":scope > .menu-content-v2-image-download");\n  if (!hasPhoto) {\n    button?.remove();\n    return;\n  }\n\n  if (!button) {\n    button = document.createElement("button");\n    button.type = "button";\n    button.className = "menu-content-v2-image-download";\n    button.innerHTML = `${iconMarkup()}<span>Download photo</span>`;\n    button.addEventListener("click", (event) => {\n      event.preventDefault();\n      event.stopPropagation();\n      downloadCurrentPhoto(button);\n    });\n    editor.appendChild(button);\n  }\n'''
          new_download = '''  // Downloads now live on the exact Original / Option cards. Remove the old\n  // generic button so it can never download an ambiguous or stale selection.\n  document.querySelectorAll(".menu-content-v2-image-download").forEach((button) => button.remove());\n'''
          download = replace_once(download, old_download, new_download, "remove generic download button")
          download_path.write_text(download)
          PY

          git config user.name "beyond-patch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/components/MenuContentImageEditor.jsx frontend/src/components/MenuContentImageStyleMatch.css frontend/src/pages/menuContentImageDownload.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Lock AI photo generations to uploaded original"
          git push origin HEAD:studio-mobile-remodel-development
